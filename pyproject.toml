[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.2.0"
description = "Local AI research agent: summarize any topic with references, streamed live, saved as .txt or .md"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langchain>=1.0",
    "langchain-community",
    "langchain-ollama>=0.3.6",
    "wikipedia",
    "duckduckgo-search",
    "ddgs",
    "python-dotenv",
]

[project.optional-dependencies]
web = ["streamlit>=1.35"]
dev = ["pytest"]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.setuptools]
packages = ["research_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
